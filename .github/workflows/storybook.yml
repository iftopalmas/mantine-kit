# Publishes the Storybook (the documentation of the components) to GitHub Pages on every push to main:
# https://iftopalmas.github.io/mantine-kit/
name: Storybook

on:
    push:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read
    pages: write
    id-token: write

# A single deployment at a time; a newer push cancels the deployment waiting to start.
concurrency:
    group: pages
    cancel-in-progress: true

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version-file: .nvmrc
            - run: corepack enable
            - run: yarn install --immutable
            - run: yarn storybook:build
            - uses: actions/upload-pages-artifact@v3
              with:
                  path: storybook-static

    deploy:
        needs: build
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - id: deployment
              uses: actions/deploy-pages@v4
