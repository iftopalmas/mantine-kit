# Build and tests on every push and Pull Request.
name: Build

on:
    push:
        branches: [main]
    pull_request:

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version-file: .nvmrc
            - run: corepack enable
            - run: yarn install --immutable
            # Prettier, lint (ESLint + Stylelint), typecheck and tests with a minimum coverage of 80%
            - run: yarn test
            - run: yarn build
